<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa sản phẩm | FreshFruit</title>
    <link rel="stylesheet" th:href="@{/css/shopowner.css}">
    <link rel="stylesheet" th:href="@{/css/shop-product.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{shopowner/fragments :: sidebar('products')}"></aside>
    <main class="main-content product-management">
        <header class="topbar">
            <div>
                <p class="breadcrumb">Chủ cửa hàng / <a th:href="@{/shop/products}">Sản phẩm</a> / <span>Chỉnh sửa</span></p>
                <h1>Chỉnh sửa sản phẩm</h1>
                <p class="muted">Cập nhật thông tin sản phẩm. Sản phẩm được hậu kiểm sau khi đăng bán.</p>
            </div>
            <a class="button button-ghost" th:href="@{/shop/product/{id}(id=${form.id})}">← Xem chi tiết</a>
        </header>

        <p class="alert alert-error" th:if="${!errors.isEmpty()}">Dữ liệu chưa hợp lệ, vui lòng kiểm tra lại.</p>

        <form class="product-form" method="post" th:action="@{/shop/product/{id}/edit(id=${form.id})}" th:object="${form}">
            <section class="form-card">
                <h2>Thông tin sản phẩm</h2>
                <div class="form-grid">
                    <label class="field field-wide">
                        <span>Tên sản phẩm <b>*</b></span>
                        <input type="text" th:field="*{name}" maxlength="200" required>
                        <em th:if="${errors.containsKey('name')}" th:text="${errors.get('name')}"></em>
                    </label>
                    <label class="field">
                        <span>Mã lô</span>
                        <input type="text" th:field="*{batchCode}" readonly>
                        <small>Mã lô không thể thay đổi sau khi tạo.</small>
                    </label>
                    <label class="field">
                        <span>Xuất xứ</span>
                        <input type="text" th:field="*{origin}" maxlength="150">
                        <em th:if="${errors.containsKey('origin')}" th:text="${errors.get('origin')}"></em>
                    </label>
                    <label class="field">
                        <span>Danh mục</span>
                        <select th:field="*{categoryId}">
                            <option value="">Chọn danh mục</option>
                            <option th:each="category : ${form.categories}" th:value="${category.id}" th:text="${category.name}"></option>
                        </select>
                        <em th:if="${errors.containsKey('categoryId')}" th:text="${errors.get('categoryId')}"></em>
                    </label>
                    <label class="field">
                        <span>Ngày nhập <b>*</b></span>
                        <input type="date" th:field="*{receivedDate}" required>
                        <em th:if="${errors.containsKey('receivedDate')}" th:text="${errors.get('receivedDate')}"></em>
                    </label>
                    <label class="field">
                        <span>Ngày hết hạn <b>*</b></span>
                        <input type="date" th:field="*{expiryDate}" required>
                        <em th:if="${errors.containsKey('expiryDate')}" th:text="${errors.get('expiryDate')}"></em>
                    </label>
                    <label class="field">
                        <span>Trạng thái bán <b>*</b></span>
                        <select th:field="*{sellingStatus}">
                            <option value="DRAFT">Bản nháp</option>
                            <option value="ACTIVE">Đang bán</option>
                            <option value="PAUSED">Tạm ngừng</option>
                            <option value="ARCHIVED">Đã ẩn</option>
                        </select>
                        <small>Có thể mở bán ngay; sản phẩm sẽ được hậu kiểm.</small>
                        <em th:if="${errors.containsKey('sellingStatus')}" th:text="${errors.get('sellingStatus')}"></em>
                    </label>
                    <label class="field field-wide">
                        <span>Mô tả</span>
                        <textarea th:field="*{description}" rows="5" maxlength="2000"></textarea>
                        <em th:if="${errors.containsKey('description')}" th:text="${errors.get('description')}"></em>
                    </label>
                </div>
            </section>
            <div class="form-actions">
                <a class="button button-ghost" th:href="@{/shop/products}">Hủy</a>
                <button class="button button-primary" type="submit">Lưu thay đổi</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
