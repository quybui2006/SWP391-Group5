<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{operations/layout :: head('Cấu hình Membership')}"></head>
<body>
<div class="operations-shell">
    <aside th:replace="~{operations/layout :: sidebar('membership-config')}"></aside>
    <main class="operations-main">
        <header th:replace="~{operations/layout :: pageHeader('Cấu hình Membership', 'Thiết lập điểm nâng hạng và hạn mức quyền lợi cho từng hạng thành viên.')}"></header>

        <section class="panel" style="max-width: 980px;">
            <div class="panel-heading">
                <div>
                    <h2>Hạng thành viên</h2>
                    <p>Hạng được xác định theo tổng chi tiêu hợp lệ trong 6 tháng gần nhất; tỷ lệ hoàn xu áp dụng cho mỗi đơn hoàn tất.</p>
                </div>
            </div>

            <div th:if="${success}" th:text="${success}" style="margin-bottom: 14px; color: #15803d; background: #f0fdf4; padding: 10px 12px; border-radius: 8px;"></div>
            <div th:if="${error}" th:text="${error}" style="margin-bottom: 14px; color: #b91c1c; background: #fef2f2; padding: 10px 12px; border-radius: 8px;"></div>

            <form method="post" th:action="@{/operations/membership-config}">
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>HẠNG</th>
                            <th>CHI TIÊU TỐI THIỂU / 6 THÁNG (₫)</th>
                            <th>HOÀN XU ( % )</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(tiers)}">
                            <td colspan="3" style="text-align: center; color: var(--muted); padding: 24px;">Chưa có hạng thành viên trong hệ thống.</td>
                        </tr>
                        <tr th:each="tier : ${tiers}">
                            <td>
                                <strong th:text="${tier.name}">Đồng</strong>
                                <input type="hidden" name="tierId" th:value="${tier.id}">
                            </td>
                            <td><input type="number" name="minSpending" min="0" step="1000" required th:value="${tier.min_spending}" style="max-width: 190px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;"></td>
                            <td><input type="number" name="cashbackPercent" min="0" max="100" step="0.01" required th:value="${tier.cashback_percent}" style="max-width: 160px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
                    <button type="submit" class="button button-primary">Lưu cấu hình</button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
