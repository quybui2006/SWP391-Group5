<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{operations/layout :: head('Danh sách Cửa hàng')}"></head>

<body>
    <div class="operations-shell">
        <aside th:replace="~{operations/layout :: sidebar('shop-list')}"></aside>
        <main class="operations-main">
            <header
                th:replace="~{operations/layout :: pageHeader('Danh sách Cửa hàng', 'Giám sát tuân thủ, kiểm soát chất lượng nông sản và xử lý vi phạm gian hàng sau khi mở bán.')}">
            </header>
            <p class="alert alert-success" th:if="${success}" th:text="${success}"></p>
            <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
            <section class="approval-page">
                <form class="table-toolbar" method="get" th:action="@{/operations/shop-list}">
                    <label class="search-field"><span aria-hidden="true">⌕</span><input type="search" name="keyword"
                            th:value="${keyword}" placeholder="Tìm Shop, chủ Shop hoặc email"></label>
                    <button class="button button-primary" type="submit">Tìm kiếm</button>
                </form>
                <div class="table-card">
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>CỬA HÀNG</th>
                                    <th>CHỦ SHOP</th>
                                    <th>LIÊN HỆ</th>
                                    <th>TRẠNG THÁI</th>
                                    <th>SẢN PHẨM / BIẾN THỂ</th>
                                    <th>THAO TÁC</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="shop : ${shops}">
                                    <td>
                                        <div class="product-cell">
                                            <span
                                                style="width: 28px; height: 28px; border-radius: 6px; background: #e0f2fe; color: #0284c7; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">🏪</span>
                                            <div>
                                                <strong th:text="${shop.name}">FreshFruit</strong>
                                                <div class="secondary-cell" th:text="${shop.address}">Địa chỉ</div>
                                            </div>
                                        </div>
                                    </td>
                                    <td><strong th:text="${shop.ownerName}">Chủ Shop</strong>
                                        <div class="secondary-cell" th:text="${shop.ownerEmail}">email</div>
                                    </td>
                                    <td th:text="${shop.phone}">Số điện thoại</td>
                                    <td><span th:class="'status-pill ' + ${#strings.toLowerCase(shop.operatingStatus)}"
                                            th:text="${shop.operatingStatus}">OPEN</span>
                                        <div class="secondary-cell" th:text="${shop.approvalStatus}">APPROVED</div>
                                    </td>
                                    <td th:text="${shop.productCount + ' hồ sơ · ' + shop.variantCount + ' biến thể'}">0
                                    </td>
                                    <td><a class="button button-secondary"
                                            th:href="@{/operations/shop-list/{id}(id=${shop.id})}">Chi tiết</a></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(shops)}">
                                    <td colspan="6" style="text-align: center; padding: 24px; color: var(--muted);">
                                        Không tìm thấy cửa hàng.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <div th:replace="~{operations/layout :: toastHost}"></div>
</body>

</html>
