<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' | FreshFruit Operations'}">FreshFruit Operations</title>
    <link rel="stylesheet" th:href="@{/css/operations.css}">
    <link rel="stylesheet" th:href="@{/css/notification-dropdown.css}">
    <script th:src="@{/js/notification-dropdown.js}" defer></script>
</head>
<body>
<aside th:fragment="sidebar(activePage)" class="operations-sidebar">
    <a class="operations-brand" th:href="@{/operations/dashboard}" aria-label="FreshFruit Operations">
        <span class="brand-mark">F</span>
        <span><strong>FreshFruit</strong><small>OPERATIONS</small></span>
    </a>
    <div class="sidebar-label">QUẢN LÝ VẬN HÀNH</div>
    <nav aria-label="Điều hướng quản lý vận hành">
        <a th:href="@{/operations/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? ' is-active' : ''">
            <span class="nav-icon" aria-hidden="true">📊</span><span>Dashboard SLA</span>
        </a>
        <a th:href="@{/operations/shops}"
           th:classappend="${activePage == 'shops'} ? ' is-active' : ''">
            <span class="nav-icon" aria-hidden="true">▦</span><span>Duyệt mở Shop</span>
        </a>
        <a th:href="@{/operations/products}"
           th:classappend="${activePage == 'products'} ? ' is-active' : ''">
            <span class="nav-icon" aria-hidden="true">▤</span><span>Duyệt sản phẩm</span>
        </a>
    </nav>
    <div class="sidebar-bottom">
        <span class="operator-dot"></span>
        <span><strong>Operations Manager</strong><small>Khu vực nội bộ sàn</small></span>
    </div>
</aside>
<header th:fragment="pageHeader(title, subtitle)" class="operations-topbar">
    <div>
        <p class="eyebrow">FRESHFRUIT / OPERATIONS</p>
        <h1 th:text="${title}">Duyệt yêu cầu</h1>
        <p class="page-subtitle" th:text="${subtitle}">Xử lý các yêu cầu đang chờ duyệt.</p>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
        <!-- In-web notification center dropdown -->
        <div class="notif-dropdown-wrapper">
            <button type="button" class="notif-bell-btn" id="globalNotifBellBtn" title="Thông báo" aria-label="Thông báo" style="background: rgba(255,255,255,0.8); border: 1px solid #cbd5e1; border-radius: 9px; padding: 6px 10px;">
                🔔
                <span class="notif-badge-count" id="globalNotifBadge" style="display:none;">0</span>
            </button>
            <div class="notif-dropdown-menu" id="globalNotifDropdownMenu">
                <div class="notif-dropdown-header">
                    <h4><span>🔔</span> Thông báo</h4>
                    <button type="button" class="notif-mark-read-all" id="globalNotifMarkAllRead">Đã đọc tất cả</button>
                </div>
                <div class="notif-dropdown-body" id="globalNotifList">
                    <div class="notif-empty-box">Đang tải...</div>
                </div>
                <div class="notif-dropdown-footer">
                    <a th:href="@{/notifications}" class="notif-view-all-link">Xem tất cả thông báo →</a>
                </div>
            </div>
        </div>

        <div class="secure-label"><span aria-hidden="true">●</span> Khu vực quản trị nội bộ</div>
        <form th:action="@{/logout}" method="post" style="display: inline-block; margin: 0;">
            <button type="submit" style="padding: 6px 12px; font-size: 13px; font-weight: 600; color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; cursor: pointer;">
                🚪 Đăng xuất
            </button>
        </form>
    </div>
</header>
<div th:fragment="toastHost" id="toastHost" class="toast-host" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
