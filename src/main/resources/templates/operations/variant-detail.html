<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{operations/layout :: head('Chi tiết biến thể sản phẩm')}"></head>
<body>
<div class="operations-shell">
    <aside th:replace="~{operations/layout :: sidebar('products')}"></aside>
    <main class="operations-main">
        <header th:replace="~{operations/layout :: pageHeader('Chi tiết biến thể sản phẩm', 'Thông tin bán hàng, tồn kho và trạng thái của biến thể.')}"></header>
        <section class="approval-page">
            <p><a class="button button-secondary" th:href="${returnUrl}">Quay lại danh sách sản phẩm</a></p>
            <div class="table-card" style="padding:24px;margin-bottom:20px">
                <div style="display:grid;grid-template-columns:minmax(180px,300px) minmax(0,1fr);gap:24px;align-items:start">
                    <img th:if="${variant.imageUrl != null and !#strings.isEmpty(variant.imageUrl)}"
                         th:src="${variant.imageUrl}" th:alt="${variant.variantName}"
                         style="width:100%;max-height:300px;object-fit:contain" onerror="this.hidden=true">
                    <div>
                        <h2 th:text="${variant.variantName}">Tên biến thể</h2>
                        <p>SKU: <code th:text="${variant.sku}">SKU</code></p>
                        <p>Sản phẩm: <strong th:text="${variant.productName}">Sản phẩm</strong></p>
                        <p>Cửa hàng: <strong th:text="${variant.shopName}">Cửa hàng</strong></p>
                        <p th:text="${variant.operationsBlocked ? 'Đang bị chặn bán' : (variant.variantStatus == 'ACTIVE' ? 'Đang bán' : 'Ngừng bán')}">Trạng thái</p>
                        <p th:if="${variant.operationsBlocked}" th:text="${'Lý do: ' + variant.operationsBlockReason}">Lý do chặn</p>
                        <form th:if="${!variant.operationsBlocked}" method="post"
                              th:action="@{/operations/variants/{id}/block(id=${variant.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                            <label for="blockReason">Lý do chặn bán</label>
                            <input id="blockReason" name="reason" type="text" minlength="5" maxlength="1000" required>
                            <button class="button button-secondary" type="submit">Chặn bán</button>
                        </form>
                        <form th:if="${variant.operationsBlocked}" method="post"
                              th:action="@{/operations/variants/{id}/unblock(id=${variant.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
                            <button class="button button-secondary" type="submit">Mở chặn</button>
                        </form>
                    </div>
                </div>
            </div>
            <p class="alert" th:if="${success}" th:text="${success}"></p>
            <p class="alert" th:if="${error}" th:text="${error}"></p>
            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px">
                <section class="table-card" style="padding:22px">
                    <h2>Thông tin bán hàng</h2>
                    <table><tbody>
                    <tr><th>Quy cách</th><td th:text="${variant.specification ?: '-'}">-</td></tr>
                    <tr><th>Giá bán</th><td th:text="${#numbers.formatInteger(variant.price, 1, 'COMMA') + ' đ'}">-</td></tr>
                    <tr><th>Đơn vị</th><td th:text="${variant.unitName}">-</td></tr>
                    <tr><th>Số lượng mua tối thiểu</th><td th:text="${variant.minOrderQuantity}">1</td></tr>
                    <tr><th>Danh mục</th><td th:text="${variant.categoryName}">-</td></tr>
                    <tr><th>Xuất xứ</th><td th:text="${variant.origin ?: 'Chưa cập nhật'}">-</td></tr>
                    </tbody></table>
                </section>
                <section class="table-card" style="padding:22px">
                    <h2>Tồn kho</h2>
                    <table><tbody>
                    <tr><th>Hiện có</th><td th:text="${variant.quantityOnHand ?: 0}">0</td></tr>
                    <tr><th>Đang giữ cho đơn</th><td th:text="${variant.reservedQuantity ?: 0}">0</td></tr>
                    <tr><th>Có thể bán</th><td th:text="${variant.availableQuantity ?: 0}">0</td></tr>
                    <tr><th>Ngưỡng tồn thấp</th><td th:text="${variant.lowStockThresholdQuantity ?: 0}">0</td></tr>
                    </tbody></table>
                </section>
            </div>
        </section>
    </main>
</div>
</body>
</html>
