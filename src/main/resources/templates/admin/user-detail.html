<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết người dùng | FreshFruit Admin</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .detail-label { color: #666; font-weight: 500; }
        .detail-value { font-weight: 600; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .badge-role { background: #e3f2fd; color: #1976d2; margin-right: 4px; }
        .address-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="admin-container">
    <a th:href="@{/admin/users}" style="text-decoration: none; color: #666; font-size: 13px;">← Quay lại danh sách người dùng</a>
    <h1 style="margin: 12px 0 20px; font-size: 24px;">Chi tiết người dùng #<span th:text="${user.id}">1</span></h1>

    <div class="card">
        <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 16px;">Thông tin cá nhân</h2>
        <div class="detail-row"><span class="detail-label">Họ và tên</span><span class="detail-value" th:text="${user.fullName}"></span></div>
        <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value" th:text="${user.email}"></span></div>
        <div class="detail-row"><span class="detail-label">Số điện thoại</span><span class="detail-value" th:text="${user.phone ?: 'Chưa cập nhật'}"></span></div>
        <div class="detail-row"><span class="detail-label">Trạng thái</span><span class="detail-value" th:text="${user.status == 'ACTIVE' ? 'Hoạt động (ACTIVE)' : 'Bị khóa (LOCKED)'}"></span></div>
        <div class="detail-row"><span class="detail-label">Xác thực Email</span><span class="detail-value" th:text="${user.emailVerifiedAt != null ? 'Đã xác thực' : 'Chưa xác thực'}"></span></div>
        <div class="detail-row">
            <span class="detail-label">Vai trò hiện tại</span>
            <div class="detail-value">
                <span class="badge badge-role" th:each="r : ${user.currentRoleCodes}" th:text="${r}">CUSTOMER</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 16px;">Sổ địa chỉ nhận hàng</h2>
        <div th:each="addr : ${user.addresses}" class="address-item">
            <p style="margin: 0 0 4px; font-weight: 600;">
                <span th:text="${addr.recipientName}"></span> - <span th:text="${addr.recipientPhone}"></span>
                <span th:if="${addr.defaultAddress}" style="color: #2e7d32; font-size: 12px; margin-left: 8px;">(Mặc định)</span>
            </p>
            <p style="margin: 0; color: #666; font-size: 13px;" th:text="${addr.addressDetail + ', ' + addr.wardName + ', ' + addr.provinceCode}"></p>
        </div>
        <p th:if="${#lists.isEmpty(user.addresses)}" style="color: #888; margin: 0;">Người dùng chưa lưu địa chỉ nào.</p>
    </div>
</div>
</body>
</html>
