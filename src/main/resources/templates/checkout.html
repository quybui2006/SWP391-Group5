<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xác nhận đơn | FreshFruit</title><link rel="stylesheet" th:href="@{/css/home.css}">
<style>main{max-width:1000px;margin:36px auto;padding:0 20px}.checkout-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}.address-option{display:block;padding:14px 0;border-bottom:1px solid #eee}.line{display:flex;justify-content:space-between;gap:18px;padding:10px 0}.totals{margin-top:18px}.grand{font-weight:800;font-size:20px;border-top:1px solid #ddd;padding-top:16px}.note{width:100%;min-height:80px;padding:10px;border:1px solid #d1d5db;border-radius:4px}@media(max-width:720px){.checkout-grid{grid-template-columns:1fr}}</style></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" th:href="@{/}"><span class="brand-mark">F</span><span><strong>FreshFruit</strong><small>Tươi ngon mỗi ngày</small></span></a><a class="login-btn" th:href="@{/cart}">Quay lại giỏ hàng</a></div></header>
<main><h1>Xác nhận đơn hàng</h1><p th:if="${#lists.isEmpty(addresses)}">Chưa có địa chỉ lưu. Nhập địa chỉ giao hàng bên dưới hoặc <a th:href="@{/customer/account/address}">quản lý sổ địa chỉ</a>.</p>
<!-- Tan PTH integration: checkout supports the backend's new-address submission even with no saved addresses. -->
<form th:action="@{/order/submit}" method="post" class="checkout-grid"><section><h2>Địa chỉ nhận hàng</h2>
<label class="address-option" th:each="address, item : ${addresses}"><input type="radio" name="addressId" th:value="${address.id}" th:checked="${address.is_default or item.first}"><strong th:text="${address.recipient_name}"></strong> · <span th:text="${address.recipient_phone}"></span><br><span th:text="${address.address_detail + ', ' + address.ward_name + ', ' + address.province_name}"></span></label>
<label class="address-option"><input type="radio" name="addressId" value="0" th:checked="${#lists.isEmpty(addresses)}"> Nhập địa chỉ giao hàng mới</label>
<label>Tên người nhận<input name="recipientName" maxlength="150" autocomplete="name"></label><br>
<label>Số điện thoại<input name="recipientPhone" maxlength="20" autocomplete="tel"></label><br>
<label>Tỉnh/thành<select name="provinceCode"><option value="">Chọn tỉnh/thành</option><option th:each="province : ${provinces}" th:value="${province.code}" th:text="${province.name}"></option></select></label><br>
<label>Phường/xã<input name="wardName" maxlength="150"></label><br>
<label>Địa chỉ cụ thể<input name="addressDetail" maxlength="500" autocomplete="street-address"></label>
<h2>Ghi chú</h2><textarea class="note" name="customerNote" maxlength="1000"></textarea><h2>Thanh toán</h2><p>Thanh toán khi nhận hàng (COD)</p></section>
<section><h2>Sản phẩm</h2><div th:each="item : ${checkoutItems}" class="line"><span th:text="${item.product_name + ' - ' + item.variant_name + ' × ' + item.quantity}"></span><strong th:text="${#numbers.formatDecimal(item.price * item.quantity,0,'COMMA',0,'POINT') + ' ₫'}"></strong></div>
<input type="hidden" name="selectedVariantIds" th:each="id : ${selectedVariantIds}" th:value="${id}"><div class="totals"><div class="line"><span>Tạm tính</span><span th:text="${#numbers.formatDecimal(subtotal,0,'COMMA',0,'POINT') + ' ₫'}"></span></div><div class="line"><span>Giao hàng</span><span th:text="${#numbers.formatDecimal(shippingFee,0,'COMMA',0,'POINT') + ' ₫'}"></span></div><div class="line grand"><span>Tổng thanh toán</span><span th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT') + ' ₫'}"></span></div></div><button type="submit" class="primary-btn" style="width:100%;justify-content:center">Đặt hàng</button></section></form></main></body></html>
