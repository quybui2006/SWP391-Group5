<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{customer/account-fragments :: head('Ví tiền')}"></head><body><div class="customer-shell"><aside th:replace="~{customer/account-fragments :: sidebar('wallet-money')}"></aside><main class="customer-main"><header th:replace="~{customer/account-fragments :: topbar('Ví tiền')}"></header><section class="account-panel wallet-panel"><div class="account-heading"><h1>Ví tiền</h1><p>Nơi lưu tiền hoàn và các giao dịch số dư của bạn.</p></div><div class="money-balance"><span>Tổng số dư</span><strong th:text="${#numbers.formatInteger(wallet.balance,1,'COMMA') + ' ₫'}">0 ₫</strong></div><div class="money-summary"><div><span>Tiền nạp</span><b th:text="${#numbers.formatInteger(wallet.total_deposited,1,'COMMA') + ' ₫'}">0 ₫</b></div><div><span>Tiền hoàn</span><b th:text="${#numbers.formatInteger(wallet.total_refunded,1,'COMMA') + ' ₫'}">0 ₫</b></div></div><div class="wallet-action-bar"><button type="button" onclick="alert('Tính năng đang phát triển')">Nạp tiền</button><button type="button" onclick="alert('Tính năng đang phát triển')">Rút tiền</button><button type="button" onclick="alert('Tính năng đang phát triển')">QR thanh toán / nhận tiền</button></div></section></main></div></body></html>
