<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{customer/account-fragments :: head('Ví voucher')}"></head><body><div class="customer-shell"><aside th:replace="~{customer/account-fragments :: sidebar('wallet-vouchers')}"></aside><main class="customer-main"><header th:replace="~{customer/account-fragments :: topbar('Ví voucher')}"></header><section class="account-panel wallet-panel"><div class="account-heading"><h1>Ví voucher</h1><p>Các mã giảm giá và mã hoàn xu bạn đã lưu.</p></div><div class="saved-voucher-grid"><article class="saved-voucher-card" th:each="v : ${savedVouchers}"><div><span class="saved-voucher-type" th:text="${v.voucher_type == 'CASHBACK' ? 'Hoàn xu' : 'Giảm giá'}">Giảm giá</span><h3 th:text="${v.code}">WELCOME10</h3><p th:text="${v.name}">Ưu đãi cửa hàng</p></div><strong th:text="${v.discount_type == 'PERCENTAGE' ? v.discount_value + '%' : #numbers.formatInteger(v.discount_value,1,'COMMA') + ' ₫'}">10%</strong></article><p class="account-empty" th:if="${#lists.isEmpty(savedVouchers)}">Bạn chưa lưu mã voucher nào.</p></div></section></main></div></body></html>
