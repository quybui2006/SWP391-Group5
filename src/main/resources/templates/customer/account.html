<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{customer/account-fragments :: head('Hồ sơ của tôi')}"></head>
<body>
<div class="customer-shell">
    <aside th:replace="~{customer/account-fragments :: sidebar('profile')}"></aside>
    <main class="customer-main">
        <header th:replace="~{customer/account-fragments :: topbar('Thông tin cá nhân')}"></header>
        <section class="account-panel">
            <div class="account-heading"><h1>Hồ sơ của tôi</h1><p>Quản lý thông tin hồ sơ để bảo mật tài khoản.</p></div>
            <p class="feedback success" th:if="${message}" th:text="${message}" role="status"></p>
            <p class="feedback error" th:if="${error}" th:text="${error}" role="alert"></p>
            <form class="profile-layout" method="post" enctype="multipart/form-data" th:action="@{/customer/account/profile}">
                <div class="profile-fields">
                    <div class="profile-row"><span class="field-caption">Tài khoản đăng nhập</span><span class="profile-value" th:text="${profile.email}"></span></div>
                    <div class="profile-row"><label for="fullName">Họ và tên</label><input id="fullName" name="fullName" required maxlength="150" autocomplete="name" th:value="${profile.full_name}"></div>
                    <div class="profile-row"><span class="field-caption">Email</span><div class="profile-value"><span th:text="${profile.email}"></span> <button class="text-button" type="button" data-pending>Thay đổi</button></div></div>
                    <div class="profile-row"><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" maxlength="16" autocomplete="tel" placeholder="Nhập số điện thoại" th:value="${profile.phone}"></div>
                    <div class="profile-row"><span class="field-caption" id="genderLabel">Giới tính</span><div class="gender-options" role="group" aria-labelledby="genderLabel">
                        <label><input type="radio" name="gender" value="MALE" th:checked="${profile.gender == 'MALE'}"> Nam</label>
                        <label><input type="radio" name="gender" value="FEMALE" th:checked="${profile.gender == 'FEMALE'}"> Nữ</label>
                        <label><input type="radio" name="gender" value="OTHER" th:checked="${profile.gender == 'OTHER'}"> Khác</label>
                    </div></div>
                    <div class="profile-row"><label for="birthDate">Ngày sinh</label><input id="birthDate" name="birthDate" type="date" min="1900-01-01" th:max="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}" th:value="${profile.birth_date}"></div>
                    <div class="profile-row save-row"><span></span><div><button class="primary-button" type="submit">Lưu thay đổi</button></div></div>
                </div>
                <div class="avatar-panel">
                    <div class="avatar-preview"><img id="avatarPreview" th:src="${profile.has_avatar} ? @{/customer/account/avatar} : @{/images/customer-avatar.svg}" alt="Ảnh đại diện của bạn"></div>
                    <label class="avatar-picker" for="avatar">Chọn ảnh</label>
                    <input class="visually-hidden" id="avatar" name="avatar" type="file" accept="image/jpeg,image/png">
                    <p>Dung lượng tối đa 1 MB<br>Định dạng: JPEG, PNG</p>
                    <span id="avatarError" class="avatar-error" role="alert"></span>
                </div>
            </form>
        </section>
    </main>
</div>
<script th:src="@{/js/customer-account-pages.js}"></script>
</body>
</html>
