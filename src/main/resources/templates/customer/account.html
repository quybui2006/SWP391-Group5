<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tai khoan | FreshFruit</title><link rel="stylesheet" th:href="@{/css/customer-account.css}"><link rel="stylesheet" th:href="@{/css/customer-account-pages.css}"></head><body><div class="customer-shell"><aside th:replace="~{customer/account-fragments :: sidebar('profile')}"></aside><main class="customer-main"><h1>Thong tin ca nhan</h1><p>Quan ly thong tin tai khoan cua ban.</p><p class="feedback success" th:if="${message}" th:text="${message}"></p><p class="feedback error" th:if="${error}" th:text="${error}"></p><section class="account-card"><form method="post" th:action="@{/customer/account/profile}"><label>Ho va ten<input name="fullName" required maxlength="150" th:value="${profile.full_name}"></label><label>Email<input readonly th:value="${profile.email}"></label><label>So dien thoai<input name="phone" maxlength="20" th:value="${profile.phone}"></label><label>Trang thai<input readonly th:value="${profile.status}"></label><button class="primary-button" type="submit">Luu thay doi</button></form></section></main></div><script src="/js/customer-account-pages.js"></script></body></html>
