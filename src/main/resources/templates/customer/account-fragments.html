<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' | FreshFruit'}"></title>
    <link rel="stylesheet" th:href="@{/css/customer-account.css}">
    <link rel="stylesheet" th:href="@{/css/customer-account-pages.css}">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
</head>
<body>
<aside class="customer-sidebar" th:fragment="sidebar(active)">
    <a class="customer-brand" th:href="@{/}"><span class="brand-mark">F</span><span><strong>Fresh<span>Fruit</span></strong><small>TƯƠI NGON MỖI NGÀY</small></span></a>
    <div class="customer-profile"><div class="profile-avatar">KH</div><div><strong th:text="${profile.full_name}"></strong><span th:text="${profile.email}"></span></div></div>
    <nav class="customer-nav">
        <span class="nav-caption">TÀI KHOẢN CỦA TÔI</span>
        <a th:classappend="${active == 'profile'} ? 'active'" th:href="@{/customer/account}"><span class="nav-symbol">♙</span>Thông tin cá nhân</a>
        <a th:classappend="${active == 'address'} ? 'active'" th:href="@{/customer/account/address}"><span class="nav-symbol">⌖</span>Sổ địa chỉ</a>
        <a th:classappend="${active == 'orders'} ? 'active'" th:href="@{/customer/account/orders}"><span class="nav-symbol">▣</span>Đơn hàng của tôi</a>
        <a th:classappend="${active == 'favorites'} ? 'active'" th:href="@{/customer/account/favorites}"><span class="nav-symbol">♡</span>Sản phẩm yêu thích</a>
        <span class="nav-caption second">KHÁC</span>
        <a href="#" data-pending><span class="nav-symbol">♧</span>Thông báo</a>
        <a href="#" data-pending><span class="nav-symbol">⚙</span>Cài đặt tài khoản</a>
    </nav>
    <div class="sidebar-help"><span>✦</span><div><strong>Cần hỗ trợ?</strong><small>Liên hệ với FreshFruit</small></div><button class="text-button" type="button" data-pending aria-label="Trợ giúp">→</button></div>
</aside>
<header class="customer-topbar" th:fragment="topbar(title)">
    <div class="breadcrumbs"><a th:href="@{/}">Trang chủ</a><span>/</span><a th:href="@{/customer/account}">Tài khoản</a><span>/</span><strong th:text="${title}"></strong></div>
    <div class="topbar-actions"><a class="top-icon" th:href="@{/search}" aria-label="Tìm kiếm sản phẩm">⌕</a><button class="top-icon notification" type="button" data-pending aria-label="Thông báo">♢<i></i></button><a class="cart-link" th:href="@{/cart}">🛒 Giỏ hàng</a></div>
</header>
</body>
</html>
