<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Don hang cua toi | FreshFruit</title><link rel="stylesheet" th:href="@{/css/customer-account.css}"><link rel="stylesheet" th:href="@{/css/customer-account-pages.css}"></head><body><div class="customer-shell"><aside th:replace="~{customer/account-fragments :: sidebar('orders')}"></aside><main class="customer-main"><h1>Don hang cua toi</h1><p>Theo doi cac don hang da dat.</p><section class="account-card table-card"><table><thead><tr><th>Ma don</th><th>Cua hang</th><th>Tong tien</th><th>Trang thai</th><th>Thanh toan</th><th>Ngay dat</th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.order_code}"></td><td th:text="${o.shop_name}"></td><td th:text="${o.total_amount}"></td><td th:text="${o.status}"></td><td th:text="${o.payment_status}"></td><td th:text="${o.created_at}"></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="6">Ban chua co don hang nao.</td></tr></tbody></table></section></main></div><script src="/js/customer-account-pages.js"></script></body></html>
