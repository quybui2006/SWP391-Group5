<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{customer/account-fragments :: head('Đổi mật khẩu')}"></head>
<body class="customer-profile-page">
<div class="customer-shell">
    <aside th:replace="~{customer/account-fragments :: sidebar('changePassword')}"></aside>
    <main class="customer-main">
        <header th:replace="~{customer/account-fragments :: topbar('Đổi mật khẩu')}"></header>
        <section class="account-panel">
            <div class="account-heading">
                <h1>Đổi mật khẩu</h1>
                <p>Để bảo mật tài khoản, vui lòng không chia sẻ mật khẩu cho người khác.</p>
            </div>
            <p class="feedback success" th:if="${message}" th:text="${message}" role="status"></p>
            <p class="feedback error" th:if="${error}" th:text="${error}" role="alert"></p>

            <form class="profile-layout" method="post" th:action="@{/customer/account/change-password}" th:object="${form}">
                <div class="profile-fields" style="max-width: 550px;">
                    <div class="profile-row">
                        <label for="oldPassword">Mật khẩu hiện tại</label>
                        <div>
                            <input id="oldPassword" th:field="*{oldPassword}" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại">
                            <span class="field-error" style="color: #dc3545; font-size: 13px; display: block; margin-top: 4px;" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></span>
                        </div>
                    </div>
                    <div class="profile-row">
                        <label for="newPassword">Mật khẩu mới</label>
                        <div>
                            <input id="newPassword" th:field="*{newPassword}" type="password" required autocomplete="new-password" placeholder="Ít nhất 6 ký tự">
                            <span class="field-error" style="color: #dc3545; font-size: 13px; display: block; margin-top: 4px;" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                        </div>
                    </div>
                    <div class="profile-row">
                        <label for="confirmPassword">Xác nhận mật khẩu</label>
                        <div>
                            <input id="confirmPassword" th:field="*{confirmPassword}" type="password" required autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
                            <span class="field-error" style="color: #dc3545; font-size: 13px; display: block; margin-top: 4px;" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>
                    <div class="profile-row save-row">
                        <span></span>
                        <div class="profile-save-actions">
                            <button class="primary-button" type="submit">Xác nhận đổi mật khẩu</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>
</div>
<script th:src="@{/js/customer-account-pages.js}"></script>
</body>
</html>
