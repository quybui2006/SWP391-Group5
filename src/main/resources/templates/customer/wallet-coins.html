<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{customer/account-fragments :: head('Ví xu')}"></head><body><div class="customer-shell"><aside th:replace="~{customer/account-fragments :: sidebar('wallet-coins')}"></aside><main class="customer-main"><header th:replace="~{customer/account-fragments :: topbar('Ví xu')}"></header><section class="account-panel wallet-panel"><div class="account-heading"><h1>Ví xu</h1><p>Quản lý số xu nhận được từ các chương trình hoàn xu.</p></div><div class="wallet-balance-card"><span>Xu đang có</span><strong th:text="${coinBalance + ' xu'}">0 xu</strong><small>Xu chưa dùng có hạn sử dụng 1 tháng.</small></div><nav class="order-tabs"><a th:classappend="${coinFilter == 'all'} ? 'active'" th:href="@{/customer/account/wallet/coins(filter='all')}">Tất cả lịch sử</a><a th:classappend="${coinFilter == 'received'} ? 'active'" th:href="@{/customer/account/wallet/coins(filter='received')}">Đã nhận</a><a th:classappend="${coinFilter == 'used'} ? 'active'" th:href="@{/customer/account/wallet/coins(filter='used')}">Đã dùng / hết hạn</a></nav><div class="wallet-history"><article th:each="item : ${coinHistory}" class="wallet-history-row"><div><strong th:text="${item.type == 'RECEIVED' ? 'Nhận xu' : (item.type == 'EXPIRED' ? 'Xu hết hạn' : 'Đã dùng xu')}">Nhận xu</strong><small th:text="${item.description ?: 'Giao dịch xu'}">Giao dịch xu</small></div><div><b th:text="${(item.type == 'RECEIVED' ? '+' : '-') + item.amount + ' xu'}">+0 xu</b><small th:text="${#temporals.format(item.created_at,'dd/MM/yyyy HH:mm')}">26/10/2026</small></div></article><p class="account-empty" th:if="${#lists.isEmpty(coinHistory)}">Chưa có lịch sử xu.</p></div></section></main></div></body></html>
