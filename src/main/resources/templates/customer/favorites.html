<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title San pham yeu thich | FreshFruit</title><link rel="stylesheet" th:href="@{/css/customer-account.css}"><link rel="stylesheet" th:href="@{/css/customer-account-pages.css}"></head><body><div class="customer-shell"><aside th:replace="~{customer/account-fragments :: sidebar('favorites')}"></aside><main class="customer-main"><h1>San pham yeu thich</h1><p>Danh sach san pham ban da luu.</p><section class="favorite-grid"><article class="favorite-card" th:each="f:${favorites}"><a th:href="@{/product/{id}(id=${f.variant_id})}"><img th:if="${f.image_url != null}" th:src="${f.image_url}"><h3 th:text="${f.product_name}"></h3><p th:text="${f.variant_name+' - '+f.sku}"></p><strong th:text="${f.price}"></strong></a><form method="post" th:action="@{/customer/account/favorites/toggle}"><input type="hidden" name="variantId" th:value="${f.variant_id}"><input type="hidden" name="redirect" value="/customer/account/favorites"><button type="submit">Bo yeu thich</button></form></article><p th:if="${#lists.isEmpty(favorites)}">Ban chua luu san pham yeu thich nao.</p></section></main></div><script src="/js/customer-account-pages.js"></script></body></html>
