<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' | CSKH FreshFruit'}">CSKH FreshFruit</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cs-primary: #0284c7;
            --cs-primary-dark: #0369a1;
            --cs-primary-light: #e0f2fe;
            --cs-sidebar-bg: #0f172a;
            --cs-sidebar-hover: #1e293b;
            --cs-bg: #f8fafc;
            --cs-text-main: #0f172a;
            --cs-text-sub: #64748b;
            --cs-border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cs-bg);
            color: var(--cs-text-main);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .cs-sidebar {
            width: 260px;
            background: var(--cs-sidebar-bg);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }

        .cs-brand {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            border-bottom: 1px solid #1e293b;
        }

        .cs-brand-mark {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
        }

        .cs-brand-info strong {
            display: block;
            font-size: 16px;
            letter-spacing: -0.3px;
        }

        .cs-brand-info small {
            display: block;
            font-size: 11px;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .cs-nav-label {
            padding: 20px 20px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .cs-nav {
            display: flex;
            flex-direction: column;
            padding: 0 10px;
            gap: 4px;
            flex: 1;
        }

        .cs-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14.5px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .cs-nav-item:hover {
            background: var(--cs-sidebar-hover);
            color: #ffffff;
        }

        .cs-nav-item.is-active {
            background: var(--cs-primary);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .cs-user-panel {
            padding: 18px 20px;
            background: #020617;
            border-top: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cs-user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0284c7;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        /* MAIN WRAPPER */
        .cs-main-wrapper {
            margin-left: 260px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .cs-topbar {
            background: #ffffff;
            border-bottom: 1px solid var(--cs-border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .cs-topbar h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--cs-text-main);
        }

        .cs-topbar-subtitle {
            margin: 2px 0 0;
            font-size: 13px;
            color: var(--cs-text-sub);
        }

        .cs-content {
            padding: 28px 32px 50px;
            max-width: 1300px;
            width: 100%;
            box-sizing: border-box;
        }

        /* KPI STATS */
        .cs-stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .cs-stat-card {
            background: #ffffff;
            border: 1px solid var(--cs-border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        .cs-stat-card:hover {
            transform: translateY(-2px);
        }

        .cs-stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .cs-stat-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--cs-text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cs-stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .cs-stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--cs-text-main);
        }

        /* TABLES & CARDS */
        .cs-card {
            background: #ffffff;
            border: 1px solid var(--cs-border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .cs-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .cs-card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--cs-text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        table.cs-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        table.cs-table th {
            padding: 12px 16px;
            background: #f8fafc;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--cs-text-sub);
            border-bottom: 1px solid var(--cs-border);
            text-transform: uppercase;
        }

        table.cs-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            vertical-align: middle;
        }

        .badge-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .badge-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .badge-info { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }

        .btn-cs-sm {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            transition: all 0.2s;
        }

        .btn-cs-sm:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }
    </style>
</head>
<body>

<!-- SIDEBAR CSKH -->
<aside th:fragment="sidebar(activePage)" class="cs-sidebar">
    <a class="cs-brand" th:href="@{/cs/dashboard}">
        <span class="cs-brand-mark">🎧</span>
        <div class="cs-brand-info">
            <strong>FreshFruit</strong>
            <small>CS STAFF DESK</small>
        </div>
    </a>

    <div class="cs-nav-label">Chăm sóc khách hàng</div>
    <nav class="cs-nav">
        <a th:href="@{/cs/dashboard}" class="cs-nav-item" th:classappend="${activePage == 'dashboard'} ? ' is-active' : ''">
            <span>📊</span><span>Tổng quan hỗ trợ</span>
        </a>
        <a th:href="@{/cs/tickets}" class="cs-nav-item" th:classappend="${activePage == 'tickets'} ? ' is-active' : ''">
            <span>🎫</span><span>Yêu cầu & Khiếu nại</span>
        </a>
        <a th:href="@{/cs/reviews}" class="cs-nav-item" th:classappend="${activePage == 'reviews'} ? ' is-active' : ''">
            <span>⭐</span><span>Đánh giá & Phản hồi</span>
        </a>
        <a th:href="@{/cs/customers}" class="cs-nav-item" th:classappend="${activePage == 'customers'} ? ' is-active' : ''">
            <span>👥</span><span>Tra cứu khách hàng</span>
        </a>
    </nav>

    <div class="cs-user-panel">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="cs-user-avatar">CS</div>
            <div>
                <strong style="font-size: 13px; display: block; color: #f8fafc;" th:text="${session.fullName ?: 'CS Staff'}">CS Staff</strong>
                <span style="font-size: 11px; color: #38bdf8;">Chăm sóc khách hàng</span>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" title="Đăng xuất" style="background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer;">
                🚪
            </button>
        </form>
    </div>
</aside>

</body>
</html>
