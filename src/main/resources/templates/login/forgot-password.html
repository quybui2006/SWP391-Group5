<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - FreshFruit</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}" aria-label="FreshFruit - Trang chủ">
            <span class="brand-mark">F</span>
            <span>
                <strong>FreshFruit</strong>
                <small>Tươi ngon mỗi ngày</small>
            </span>
        </a>
        <a th:href="@{/login}" class="secondary-btn" style="min-height: 38px; padding: 0 16px;">Về đăng nhập</a>
    </div>
</header>

<main class="login-main">
    <section class="login-card">
        <span class="login-eyebrow">KHÔI PHỤC TÀI KHOẢN</span>
        <h1>Quên mật khẩu</h1>
        <p>Nhập email đăng ký của bạn. Chúng tôi sẽ gửi mã OTP để đặt lại mật khẩu.</p>

        <p class="login-error" th:if="${error}" th:text="${error}" role="alert"></p>

        <form th:action="@{/forgot-password}" method="post">
            <label for="email">Email tài khoản</label>
            <input id="email" name="email" type="email" placeholder="example@gmail.com" required maxlength="254" autocomplete="email">

            <button type="submit">Gửi mã OTP xác minh</button>
        </form>

        <p style="margin-top: 20px; font-size: 13px;">Nhớ lại mật khẩu? <a th:href="@{/login}" style="color: var(--green-dark); font-weight: 600;">Đăng nhập ngay</a></p>
    </section>
</main>
</body>
</html>
