<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - FreshFruit</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}" aria-label="FreshFruit - Trang chủ">
            <span class="brand-mark">F</span>
            <span>
                <strong>FreshFruit</strong>
                <small>Tươi ngon mỗi ngày</small>
            </span>
        </a>
        <a th:href="@{/login}" class="secondary-btn" style="min-height: 38px; padding: 0 16px;">Về đăng nhập</a>
    </div>
</header>

<main class="login-main">
    <div class="register-shell">
        <!-- Flipgrid-style Account Type Tabs -->
        <div class="role-selector-header" role="tablist" aria-label="Loại tài khoản đăng ký">
            <button type="button" class="role-tab-btn active" id="tabCustomer" data-role="CUSTOMER" role="tab" aria-selected="true">
                <span class="tab-check" id="checkCustomer">✓</span> KHÁCH HÀNG
            </button>
            <button type="button" class="role-tab-btn" id="tabShopOwner" data-role="SHOP_OWNER" role="tab" aria-selected="false">
                <span class="tab-check" id="checkShopOwner" style="display:none;">✓</span> BÁN HÀNG
            </button>
        </div>

        <section class="login-card register-card">
            <span class="login-eyebrow" id="roleEyebrow">FRESHFRUIT</span>
            <h1 id="registerTitle">Đăng ký khách hàng</h1>
            <p id="registerSub" class="register-subtitle">Tạo tài khoản để mua sắm hoa quả sạch chuẩn VietGAP và nhận ưu đãi mỗi ngày.</p>

            <form th:action="@{/register}" th:object="${form}" method="post">
                <!-- Hidden input to hold the selected role -->
                <input type="hidden" id="roleInput" th:field="*{role}">

                <label for="fullName" id="nameLabel">Họ và tên</label>
                <input id="fullName" th:field="*{fullName}" maxlength="150" placeholder="Nguyễn Văn A" required>
                <p class="login-error" th:if="${#fields.hasErrors('fullName')}"
                   th:errors="*{fullName}"></p>

                <label for="email" id="emailLabel">Email</label>
                <input id="email" type="email" th:field="*{email}" maxlength="254" placeholder="email@example.com" required>
                <p class="login-error" th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"></p>

                <label for="phone">Số điện thoại (không bắt buộc)</label>
                <input id="phone" type="tel" th:field="*{phone}" maxlength="20" placeholder="0912345678">

                <label for="password">Mật khẩu</label>
                <input id="password" name="password" type="password" minlength="8" placeholder="Tối thiểu 8 ký tự" required>
                <p class="login-error" th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}"></p>

                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Nhập lại mật khẩu" required>
                <p class="login-error" th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}"></p>

                <button type="submit" id="submitBtn">Đăng ký tài khoản Khách hàng</button>
            </form>
            <p style="margin-top: 20px;">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
        </section>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tabCustomer = document.getElementById('tabCustomer');
        const tabShopOwner = document.getElementById('tabShopOwner');
        const checkCustomer = document.getElementById('checkCustomer');
        const checkShopOwner = document.getElementById('checkShopOwner');
        const roleInput = document.getElementById('roleInput');
        const roleEyebrow = document.getElementById('roleEyebrow');
        const registerTitle = document.getElementById('registerTitle');
        const registerSub = document.getElementById('registerSub');
        const submitBtn = document.getElementById('submitBtn');

        function setRole(role) {
            if (role === 'SHOP_OWNER') {
                tabShopOwner.classList.add('active');
                tabCustomer.classList.remove('active');
                checkShopOwner.style.display = 'inline-flex';
                checkCustomer.style.display = 'none';
                roleInput.value = 'SHOP_OWNER';
                roleEyebrow.textContent = 'FRESHFRUIT PARTNER';
                registerTitle.textContent = 'Đăng ký Người bán hàng';
                registerSub.textContent = 'Tạo tài khoản bán hàng để mở gian hàng, quản lý kho và tiếp cận hàng ngàn khách hàng.';
                submitBtn.textContent = 'Đăng ký tài khoản Bán hàng';
            } else {
                tabCustomer.classList.add('active');
                tabShopOwner.classList.remove('active');
                checkCustomer.style.display = 'inline-flex';
                checkShopOwner.style.display = 'none';
                roleInput.value = 'CUSTOMER';
                roleEyebrow.textContent = 'FRESHFRUIT';
                registerTitle.textContent = 'Đăng ký khách hàng';
                registerSub.textContent = 'Tạo tài khoản để mua sắm hoa quả sạch chuẩn VietGAP và nhận ưu đãi mỗi ngày.';
                submitBtn.textContent = 'Đăng ký tài khoản Khách hàng';
            }
        }

        tabCustomer.addEventListener('click', function() {
            setRole('CUSTOMER');
        });

        tabShopOwner.addEventListener('click', function() {
            setRole('SHOP_OWNER');
        });

        // Initialize from URL params or hidden input value
        const urlParams = new URLSearchParams(window.location.search);
        const urlRole = urlParams.get('role');
        if (urlRole && (urlRole.toLowerCase() === 'seller' || urlRole.toLowerCase() === 'shop_owner' || urlRole.toLowerCase() === 'shopowner')) {
            setRole('SHOP_OWNER');
        } else if (roleInput && roleInput.value === 'SHOP_OWNER') {
            setRole('SHOP_OWNER');
        } else {
            setRole('CUSTOMER');
        }
    });
</script>
</body>
</html>
