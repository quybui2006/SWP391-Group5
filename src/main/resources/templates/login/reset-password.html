<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - FreshFruit</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">F</span>
            <span>
                <strong>FreshFruit</strong>
                <small>Tươi ngon mỗi ngày</small>
            </span>
        </a>
        <a th:href="@{/login}" class="secondary-btn" style="min-height: 38px; padding: 0 16px;">Về đăng nhập</a>
    </div>
</header>

<main class="login-main">
    <section class="login-card">
        <span class="login-eyebrow">BẢO MẬT TÀI KHOẢN</span>
        <h1>Đặt lại mật khẩu</h1>
        <p>Mã xác minh đã gửi tới: <strong th:text="${email}"></strong> (hiệu lực 5 phút)</p>

        <p style="color: var(--green-dark); font-weight: 600;" th:if="${message}" th:text="${message}"></p>
        <p class="login-error" th:if="${error}" th:text="${error}" role="alert"></p>

        <form th:action="@{/reset-password}" th:object="${form}" method="post">
            <label for="code">Mã OTP (6 chữ số)</label>
            <input id="code" th:field="*{code}" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
            <p class="login-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></p>

            <label for="newPassword">Mật khẩu mới</label>
            <input id="newPassword" th:field="*{newPassword}" type="password" placeholder="Tối thiểu 6 ký tự" required>
            <p class="login-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>

            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
            <input id="confirmPassword" th:field="*{confirmPassword}" type="password" placeholder="Nhập lại mật khẩu mới" required>
            <p class="login-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

            <button type="submit">Xác nhận & Lưu mật khẩu</button>
        </form>

        <p>Chưa nhận được mã? <a th:href="@{/forgot-password}">Gửi lại mã OTP</a></p>
    </section>
</main>
</body>
</html>
