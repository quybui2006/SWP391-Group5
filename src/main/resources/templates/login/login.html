<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - FreshFruit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/freshfruit-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">F</span>
            <span>
                <strong>FreshFruit</strong>
                <small>Tươi ngon mỗi ngày</small>
            </span>
        </a>
        <a th:href="@{/}" class="secondary-btn" style="min-height: 38px; padding: 0 16px;">Về trang chủ</a>
    </div>
</header>

<main class="login-main">
    <section class="login-card">
        <span class="login-eyebrow">CHÀO MỪNG TRỞ LẠI</span>
        <h1>Đăng nhập</h1>
        <p>Đăng nhập để tiếp tục với FreshFruit.</p>

        <p class="login-error" th:if="${error}" th:text="${error}" role="alert"></p>
        <p class="login-error" th:if="${param.error}" role="alert">Email hoặc mật khẩu không chính xác.</p>
        <p th:if="${success}" th:text="${success}"></p>
        <p class="login-notice" th:if="${param.logout}" style="padding: 12px; color: var(--green-dark); background: var(--green-light); border-radius: 10px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
            <svg class="ui-icon ui-icon-xs" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Bạn đã đăng xuất thành công.</span>
        </p>

        <form th:action="@{/login}" method="post">
            <!-- Tan PTH integration: return to the requested customer screen after login. -->
            <input type="hidden" name="continueTo" th:value="${continueTo}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email"
                   autocomplete="username" maxlength="254" required>

            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
            <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
                <a th:href="@{/forgot-password}" style="font-size: 0.9rem; color: var(--green-dark); font-weight: 600; text-decoration: none;">Quên mật khẩu?</a>
            </div>
            <button type="submit">Đăng nhập</button>
        </form>
        <p>Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
    </section>
</main>
</body>
</html>
