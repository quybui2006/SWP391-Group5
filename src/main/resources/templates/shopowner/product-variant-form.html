<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biến thể và tồn kho | FreshFruit</title>
    <link rel="stylesheet" th:href="@{/css/shopowner.css}">
    <link rel="stylesheet" th:href="@{/css/shop-product.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{shopowner/fragments :: sidebar('variants')}"></aside>
    <main class="main-content product-management">
        <header class="topbar">
            <div>
                <p class="breadcrumb">Chủ cửa hàng / <a th:href="@{/shopowner/product-variants}">Biến thể sản phẩm</a> / <span>Thêm mới</span></p>
                <h1>Biến thể và tồn kho</h1>
                <p class="muted">Tạo loại hàng, nhập số lượng ban đầu và thêm ảnh.</p>
            </div>
            <a class="button button-ghost" th:href="@{/shopowner/product-variants}">← Danh sách biến thể</a>
        </header>

        <p class="alert alert-error" th:if="${serviceError}" th:text="${serviceError}">Lỗi hệ thống</p>

        <form class="product-form" method="post" enctype="multipart/form-data"
              th:action="@{/shopowner/product-variants/add}" th:object="${variantCreateRequest}">
            <section class="form-card">
                <h2>Thông tin biến thể</h2>
                <div class="form-grid">
                    <label class="field field-wide">
                        <span>Sản phẩm <b>*</b></span>
                        <select th:field="*{productId}" required>
                            <option value="">Chọn sản phẩm</option>
                            <option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}"></option>
                        </select>
                        <small>Chọn sản phẩm vừa tạo hoặc một sản phẩm đã có.</small>
                        <em th:errors="*{productId}"></em>
                    </label>
                    <label class="field">
                        <span>Tên biến thể <b>*</b></span>
                        <input type="text" th:field="*{variantName}" maxlength="150" required>
                        <em th:errors="*{variantName}"></em>
                    </label>
                    <label class="field">
                        <span>Mã SKU dự kiến</span>
                        <input type="text" th:value="${skuPreview}" readonly>
                        <small>Mã chính thức được xác nhận sau khi lưu.</small>
                    </label>
                    <label class="field">
                        <span>Đơn vị <b>*</b></span>
                        <select th:field="*{unitId}" required>
                            <option value="">Chọn đơn vị</option>
                            <option th:each="unit : ${units}" th:value="${unit.id}" th:text="${unit.name}"></option>
                        </select>
                        <em th:errors="*{unitId}"></em>
                    </label>
                    <label class="field">
                        <span>Giá bán (VNĐ) <b>*</b></span>
                        <input type="number" th:field="*{price}" min="1" step="1" required>
                        <em th:errors="*{price}"></em>
                    </label>
                </div>
            </section>

            <section class="form-card">
                <h2>Tồn kho ban đầu</h2>
                <div class="form-grid">
                    <label class="field">
                        <span>Số lượng nhập <b>*</b></span>
                        <input type="number" th:field="*{stockQuantity}" min="1" step="1" required>
                        <em th:errors="*{stockQuantity}"></em>
                    </label>
                    <label class="field">
                        <span>Ngưỡng cảnh báo tồn thấp</span>
                        <input type="number" th:field="*{lowStockThresholdQuantity}" min="0" step="1">
                        <small>Cảnh báo khi số lượng có thể bán bằng hoặc thấp hơn ngưỡng. Để trống để tắt.</small>
                        <em th:errors="*{lowStockThresholdQuantity}"></em>
                    </label>
                </div>
            </section>

            <section class="form-card">
                <h2>Hình ảnh biến thể</h2>
                <div class="upload-row upload-validation-row">
                    <label class="upload-box" for="imageFile">
                        <input id="imageFile" type="file" th:field="*{imageFile}" accept="image/jpeg,image/png" required
                               aria-describedby="variantImageHelp variantImageValidationError"
                               data-upload-max-bytes="5242880" data-upload-allowed-types="image/jpeg,image/png"
                               data-upload-label="Ảnh biến thể" data-upload-error-id="variantImageValidationError">
                        <span>Chọn ảnh JPG hoặc PNG</span>
                        <small id="variantImageHelp">Dung lượng tối đa 5 MB. Ảnh vượt giới hạn sẽ bị chặn trước khi gửi biểu mẫu.</small>
                    </label>
                    <small id="variantImageValidationError" class="upload-validation-error" role="alert" aria-live="polite" hidden></small>
                </div>
                <em class="field-error" th:errors="*{imageFile}"></em>
            </section>

            <div class="form-actions">
                <a class="button button-ghost" th:href="@{/shopowner/product-variants}">Hủy</a>
                <button class="button button-primary" type="submit">Lưu loại hàng</button>
            </div>
        </form>
    </main>
</div>
<script th:src="@{/js/shop-product.js}"></script>
<script th:src="@{/js/upload-validation.js?v=20261017}"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/vn.js"></script>
<script th:src="@{/js/vn-date-time.js(v=20261103)}"></script>
</body>
</html>
