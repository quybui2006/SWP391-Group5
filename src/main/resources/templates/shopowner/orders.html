<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đơn hàng | FreshFruit</title><link rel="stylesheet" th:href="@{/css/shopowner.css}"><link rel="stylesheet" th:href="@{/css/shop-product.css}"></head>
<body><div class="app-shell"><aside th:replace="~{shopowner/fragments :: sidebar('orders')}"></aside><main class="main-content product-management"><header class="topbar"><div><p class="breadcrumb">Shop Owner / <span>Đơn hàng</span></p><h1>Đơn hàng</h1><p class="muted">Các đơn hàng thuộc cửa hàng của bạn.</p></div></header><section class="panel"><div class="table-wrap"><table><thead><tr><th>MÃ ĐƠN</th><th>NGƯỜI NHẬN</th><th>TỔNG TIỀN</th><th>TRẠNG THÁI</th><th>THANH TOÁN</th><th>NGÀY TẠO</th></tr></thead><tbody><tr th:each="o : ${orders}"><td><a th:href="@{/shopowner/orders/{id}(id=${o.id})}" th:text="${o.order_code}"></a></td><td th:text="${o.recipient_name}"></td><td th:text="${#numbers.formatInteger(o.total_amount,1,'COMMA') + ' ₫'}"></td><td th:text="${o.status}"></td><td th:text="${o.payment_status}"></td><td th:text="${o.created_at}"></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="6" class="muted">Chưa có đơn hàng nào.</td></tr></tbody></table></div></section></main></div></body></html>
