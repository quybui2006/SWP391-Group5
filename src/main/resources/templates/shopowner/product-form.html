<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm | FreshFruit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/shopowner.css}">
    <link rel="stylesheet" th:href="@{/css/shop-product.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{shopowner/fragments :: sidebar('products')}"></aside>
    <main class="main-content product-management">
        <header class="topbar">
            <div>
                <p class="breadcrumb">Chủ cửa hàng / <a th:href="@{/shop/products}">Sản phẩm</a> / <span>Thêm mới</span></p>
                <h1>Thêm sản phẩm</h1>
                <p class="muted">Nhập thông tin và ảnh sản phẩm. Sau khi lưu, bạn có thể quản lý biến thể và tồn kho riêng trong mục Biến thể sản phẩm.</p>
            </div>
            <a class="button button-ghost" th:href="@{/shop/products}">← Danh sách sản phẩm</a>
        </header>

        <p class="alert alert-error" th:if="${serviceError}" th:text="${serviceError}">Lỗi hệ thống</p>

        <form class="product-form" method="post" enctype="multipart/form-data" th:action="@{/shop/products/add}" th:object="${productCreateRequest}">
            <section class="form-card">
                <h2>Thông tin sản phẩm</h2>
                <div class="form-grid">
                    <label class="field field-wide">
                        <span>Tên sản phẩm <b>*</b></span>
                        <input type="text" th:field="*{name}" maxlength="200" placeholder="Ví dụ: Cam sành Vĩnh Long" required>
                        <em th:errors="*{name}"></em>
                    </label>
                    <label class="field field-wide">
                        <span>Ảnh sản phẩm <b>*</b></span>
                        <input id="productImage" type="file" th:field="*{imageFile}" accept="image/jpeg,image/png" required
                               aria-describedby="productImageHelp productImageValidationError"
                               data-upload-max-bytes="5242880" data-upload-allowed-types="image/jpeg,image/png"
                               data-upload-label="Ảnh sản phẩm" data-upload-error-id="productImageValidationError"
                               data-upload-preview-id="productImagePreview">
                        <small id="productImageHelp">Bắt buộc. Chỉ chấp nhận ảnh JPG hoặc PNG, dung lượng tối đa 5 MB. Ảnh vượt giới hạn sẽ bị chặn trước khi gửi biểu mẫu.</small>
                        <small id="productImageValidationError" class="upload-validation-error" role="alert" aria-live="polite" hidden></small>
                        <em th:errors="*{imageFile}"></em>
                        <img id="productImagePreview" alt="Xem trước ảnh sản phẩm" style="display:none; max-width:220px; max-height:180px; margin-top:10px; border-radius:10px; object-fit:contain;">
                    </label>
                    <label class="field">
                        <span>Mã lô <b>*</b></span>
                        <input type="text" th:field="*{batchCode}" maxlength="60" placeholder="Ví dụ: CAM-20261012" required>
                        <em th:errors="*{batchCode}"></em>
                    </label>
                    <div class="field">
                        <label for="categoryIds" class="form-label fw-semibold">
                            Danh mục <span class="text-danger">*</span>
                        </label>

                        <select id="categoryIds"
                                class="form-select"
                                th:field="*{categoryIds}">
                            <option value="">Chọn danh mục</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">
                            </option>
                        </select>
                    </div>
                    <label class="field">
                        <span>Xuất xứ</span>
                        <input type="text" th:field="*{origin}" maxlength="150" placeholder="Ví dụ: Vĩnh Long">
                        <em th:errors="*{origin}"></em>
                    </label>
                    <label class="field">
                        <span>Ngày nhập <b>*</b></span>
                        <input id="receivedDate" type="date" th:field="*{receivedDate}" required aria-describedby="receivedDateHelp">
                        <small id="receivedDateHelp">Chọn ngày nhập kho (không được ở tương lai).</small>
                        <em th:errors="*{receivedDate}"></em>
                    </label>
                    <label class="field">
                        <span>Ngày hết hạn <b>*</b></span>
                        <input id="expiryDate" type="date" th:field="*{expiryDate}" required aria-describedby="expiryDateHelp">
                        <small id="expiryDateHelp">Ngày hết hạn phải sau ngày nhập kho.</small>
                        <em th:errors="*{expiryDate}"></em>
                    </label>
                    <label class="field field-wide">
                        <span>Mô tả</span>
                        <textarea th:field="*{description}" rows="4" placeholder="Mô tả ngắn về chất lượng, đặc điểm sản phẩm..."></textarea>
                        <em th:errors="*{description}"></em>
                    </label>

                </div>
            </section>
            <div class="form-actions">
                <a class="button button-ghost" th:href="@{/shop/products}">Hủy</a>
                <button class="button button-primary" type="submit">Lưu sản phẩm</button>
            </div>
        </form>
        <script th:src="@{/js/upload-validation.js?v=20261017}"></script>
        <script>
            (() => {
                const received = document.getElementById("receivedDate");
                const expiry = document.getElementById("expiryDate");
                if (!received || !expiry) return;
                function nextDate(value) {
                    const date = new Date(value + "T00:00:00");
                    date.setDate(date.getDate() + 1);
                    return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
                }
                function validateExpiry() {
                    expiry.min = received.value ? nextDate(received.value) : "";
                    expiry.setCustomValidity(received.value && expiry.value && expiry.value <= received.value
                        ? "Ngày hết hạn phải sau ngày nhập kho." : "");
                }
                received.addEventListener("change", validateExpiry);
                expiry.addEventListener("change", validateExpiry);
                validateExpiry();
            })();
        </script>
    </main>
</div>
</body>
</html>
