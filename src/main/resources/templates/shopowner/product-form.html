<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm | FreshFruit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/css/shopowner.css}">
    <link rel="stylesheet" th:href="@{/css/shop-product.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{shopowner/fragments :: sidebar('products')}"></aside>
    <main class="main-content product-management">
        <header class="topbar">
            <div>
                <p class="breadcrumb">Chủ cửa hàng / <a th:href="@{/shop/products}">Sản phẩm</a> / <span>Thêm mới</span></p>
                <h1>Thêm sản phẩm</h1>
                <p class="muted">Nhập thông tin và ảnh sản phẩm. Sau khi lưu, bạn có thể quản lý biến thể và tồn kho riêng trong mục Biến thể sản phẩm.</p>
            </div>
            <a class="button button-ghost" th:href="@{/shop/products}">← Danh sách sản phẩm</a>
        </header>

        <p class="alert alert-error" th:if="${serviceError}" th:text="${serviceError}">Lỗi hệ thống</p>

        <form class="product-form" method="post" enctype="multipart/form-data" th:action="@{/shop/products/add}" th:object="${productCreateRequest}">
            <section class="form-card">
                <h2>Thông tin sản phẩm</h2>
                <div class="form-grid">
                    <label class="field field-wide">
                        <span>Tên sản phẩm <b>*</b></span>
                        <input type="text" th:field="*{name}" maxlength="200" placeholder="Ví dụ: Cam sành Vĩnh Long" required>
                        <em th:errors="*{name}"></em>
                    </label>
                    <label class="field field-wide">
                        <span>Ảnh sản phẩm <b>*</b></span>
                        <input id="productImage" type="file" th:field="*{imageFile}" accept="image/jpeg,image/png" required
                               aria-describedby="productImageHelp productImageValidationError"
                               data-upload-max-bytes="5242880" data-upload-allowed-types="image/jpeg,image/png"
                               data-upload-label="Ảnh sản phẩm" data-upload-error-id="productImageValidationError"
                               data-upload-preview-id="productImagePreview">
                        <small id="productImageHelp">Bắt buộc. Chỉ chấp nhận ảnh JPG hoặc PNG, dung lượng tối đa 5 MB. Ảnh vượt giới hạn sẽ bị chặn trước khi gửi biểu mẫu.</small>
                        <small id="productImageValidationError" class="upload-validation-error" role="alert" aria-live="polite" hidden></small>
                        <em th:errors="*{imageFile}"></em>
                        <img id="productImagePreview" alt="Xem trước ảnh sản phẩm" style="display:none; max-width:220px; max-height:180px; margin-top:10px; border-radius:10px; object-fit:contain;">
                    </label>
                    <label class="field">
                        <span>Mã lô <b>*</b></span>
                        <input type="text" th:field="*{batchCode}" maxlength="60" placeholder="Ví dụ: CAM-20261012" required>
                        <em th:errors="*{batchCode}"></em>
                    </label>
                    <div class="field">
                        <label for="categoryIds" class="form-label fw-semibold">
                            Danh mục <span class="text-danger">*</span>
                        </label>

                        <select id="categoryIds"
                                class="form-select"
                                th:field="*{categoryIds}">
                            <option value="">Chọn danh mục</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">
                            </option>
                        </select>
                    </div>
                    <label class="field">
                        <span>Xuất xứ</span>
                        <input type="text" th:field="*{origin}" maxlength="150" placeholder="Ví dụ: Vĩnh Long">
                        <em th:errors="*{origin}"></em>
                    </label>
                    <label class="field">
                        <span>Ngày nhập <b>*</b></span>
                        <input id="receivedDateDisplay" type="text" class="date-picker-vn" th:value="${productCreateRequest.receivedDate == null ? '' : #temporals.format(productCreateRequest.receivedDate, 'dd/MM/yyyy')}" placeholder="dd/MM/yyyy" autocomplete="off" required aria-describedby="receivedDateHelp">
<input id="receivedDate" type="hidden" th:field="*{receivedDate}">
                        <small id="receivedDateHelp">Chọn ngày nhập kho (không được ở tương lai).</small>
                        <em th:errors="*{receivedDate}"></em>
                    </label>
                    <label class="field">
                        <span>Ngày hết hạn <b>*</b></span>
                        <input id="expiryDateDisplay" type="text" class="date-picker-vn" th:value="${productCreateRequest.expiryDate == null ? '' : #temporals.format(productCreateRequest.expiryDate, 'dd/MM/yyyy')}" placeholder="dd/MM/yyyy" autocomplete="off" required aria-describedby="expiryDateHelp">
<input id="expiryDate" type="hidden" th:field="*{expiryDate}">
                        <small id="expiryDateHelp">Ngày hết hạn phải sau ngày nhập kho.</small>
                        <em th:errors="*{expiryDate}"></em>
                    </label>
                    <label class="field field-wide">
                        <span>Mô tả</span>
                        <textarea th:field="*{description}" rows="4" placeholder="Mô tả ngắn về chất lượng, đặc điểm sản phẩm..."></textarea>
                        <em th:errors="*{description}"></em>
                    </label>

                </div>
            </section>
            <div class="form-actions">
                <a class="button button-ghost" th:href="@{/shop/products}">Hủy</a>
                <button class="button button-primary" type="submit">Lưu sản phẩm</button>
            </div>
        </form>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/vn.js"></script>
        <script th:src="@{/js/upload-validation.js?v=20261017}"></script>
        <script>
            (() => {
                const form = document.querySelector("form.product-form");
                const receivedDisplay = document.getElementById("receivedDateDisplay");
                const expiryDisplay = document.getElementById("expiryDateDisplay");
                const received = document.getElementById("receivedDate");
                const expiry = document.getElementById("expiryDate");
                if (!form || !receivedDisplay || !expiryDisplay || !received || !expiry || !window.flatpickr) return;

                const locale = (flatpickr.l10ns && flatpickr.l10ns.vn) || "default";
                function parseDate(text) {
                    const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((text || "").trim());
                    if (!match) return null;
                    const day = Number(match[1]), month = Number(match[2]), year = Number(match[3]);
                    const date = new Date(year, month - 1, day);
                    if (year < 1900 || date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
                    return `${match[3]}-${match[2]}-${match[1]}`;
                }
                function vietnamToday() {
                    const parts = new Intl.DateTimeFormat("en-CA", {
                        timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit", day: "2-digit"
                    }).formatToParts(new Date());
                    const v = Object.fromEntries(parts.map(p => [p.type, p.value]));
                    return `${v.year}-${v.month}-${v.day}`;
                }
                function nextDate(iso) {
                    if (!iso) return "";
                    const [year, month, day] = iso.split("-").map(Number);
                    const date = new Date(Date.UTC(year, month - 1, day + 1));
                    return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, "0")}-${String(date.getUTCDate()).padStart(2, "0")}`;
                }
                function syncAndValidate(showError) {
                    received.value = parseDate(receivedDisplay.value) || "";
                    expiry.value = parseDate(expiryDisplay.value) || "";
                    receivedDisplay.setCustomValidity("");
                    expiryDisplay.setCustomValidity("");
                    if (!received.value) {
                        receivedDisplay.setCustomValidity("Chọn ngày nhập theo định dạng ngày/tháng/năm.");
                    } else if (received.value > vietnamToday()) {
                        receivedDisplay.setCustomValidity("Ngày nhập không được ở tương lai theo giờ Việt Nam.");
                    } else if (!expiry.value) {
                        expiryDisplay.setCustomValidity("Chọn ngày hết hạn theo định dạng ngày/tháng/năm.");
                    } else if (expiry.value <= received.value) {
                        expiryDisplay.setCustomValidity("Ngày hết hạn phải sau ngày nhập kho.");
                    }
                    const valid = receivedDisplay.checkValidity() && expiryDisplay.checkValidity();
                    if (!valid && showError) (receivedDisplay.validationMessage ? receivedDisplay : expiryDisplay).reportValidity();
                    return valid;
                }
                let expiryPicker;
                const receivedPicker = flatpickr(receivedDisplay, {
                    dateFormat: "d/m/Y", locale, allowInput: true, disableMobile: true, maxDate: vietnamToday(),
                    onChange: () => {
                        syncAndValidate(false);
                        if (expiryPicker) expiryPicker.set("minDate", received.value ? nextDate(received.value) : null);
                    }
                });
                expiryPicker = flatpickr(expiryDisplay, {
                    dateFormat: "d/m/Y", locale, allowInput: true, disableMobile: true,
                    minDate: received.value ? nextDate(received.value) : null,
                    onChange: () => syncAndValidate(false)
                });
                receivedDisplay.addEventListener("input", () => {
                    syncAndValidate(false);
                    expiryPicker.set("minDate", received.value ? nextDate(received.value) : null);
                });
                expiryDisplay.addEventListener("input", () => syncAndValidate(false));
                form.addEventListener("submit", event => {
                    if (!syncAndValidate(true)) event.preventDefault();
                });
                syncAndValidate(false);
            })();
        </script>
    </main>
</div>
</body>
</html>
