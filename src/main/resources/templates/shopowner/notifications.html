<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo | FreshFruit</title>
    <link rel="stylesheet" th:href="@{/css/shopowner.css}">
    <link rel="stylesheet" th:href="@{/css/shop-product.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{shopowner/fragments :: sidebar('notifications')}"></aside>

    <main class="main-content product-management notification-page">
        <header class="topbar">
            <div>
                <p class="breadcrumb">Chủ cửa hàng / <span>Thông báo</span></p>
                <h1>Thông báo</h1>
                <p class="muted">Theo dõi cập nhật về đơn hàng và hoạt động cửa hàng.</p>
            </div>
            <button type="button"
                    class="button button-primary"
                    id="readAll"
                    th:disabled="${unreadCount == 0}">
                Đọc tất cả
            </button>
        </header>

        <section class="notification-tools panel">
            <form method="get"
                  th:action="@{/shopowner/notifications}"
                  class="notification-filter-form">
                <label class="notification-search">
                    <span>Tìm thông báo</span>
                    <input type="search"
                           name="keyword"
                           th:value="${keyword}"
                           autocomplete="off">
                </label>

                <label class="notification-status-filter">
                    <span>Trạng thái</span>
                    <select name="status">
                        <option value="all" th:selected="${selectedStatus == 'all'}">Tất cả</option>
                        <option value="unread" th:selected="${selectedStatus == 'unread'}">Chưa đọc</option>
                        <option value="read" th:selected="${selectedStatus == 'read'}">Đã đọc</option>
                    </select>
                </label>

                <button type="submit" class="button button-secondary">Tìm kiếm</button>
                <a class="button button-ghost" th:href="@{/shopowner/notifications}">Xóa lọc</a>
            </form>

            <p class="notification-result-count"
               th:text="${notifications.size() + ' thông báo'}">
                0 thông báo
            </p>
        </section>

        <section class="panel notification-list-panel">
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Trạng thái</th>
                        <th>Thông báo</th>
                        <th>Thời gian</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Cảnh báo tồn kho được tính từ tồn khả dụng và ngưỡng đã cấu hình. -->
                    <tr th:each="alert : ${lowStockAlerts}"
                        th:if="${selectedStatus != 'read'
                            and (#strings.isEmpty(keyword)
                            or #strings.containsIgnoreCase(alert.product_name, keyword)
                            or #strings.containsIgnoreCase(alert.variant_name, keyword)
                            or #strings.containsIgnoreCase(alert.sku, keyword))}">
                        <td>
                            <span class="badge badge-active">Cần xử lý</span>
                        </td>
                        <td>
                            <strong>Cảnh báo tồn kho thấp</strong>
                            <div class="secondary-cell"
                                 th:text="${alert.product_name + ' - ' + alert.variant_name
                                 + ' (' + alert.sku + ') còn ' + alert.available_quantity
                                 + ' ' + alert.unit_name + ', ngưỡng '
                                 + alert.threshold_quantity + ' ' + alert.unit_name}">
                                Chi tiết tồn thấp
                            </div>
                        </td>
                        <td>Hiện tại</td>
                        <td class="notification-actions">
                            <a class="button button-primary"
                               th:href="@{/shopowner/inventory/batches/new(inventoryId=${alert.inventory_id})}">
                                Nhập lô hàng
                            </a>
                            <a class="button button-ghost"
                               th:href="@{/shopowner/inventory}">
                                Tồn kho
                            </a>
                        </td>
                    </tr>

                    <tr th:each="item : ${notifications}"
                        th:attr="data-notification-id=${item.id}">
                        <td>
                            <span class="badge"
                                  th:classappend="${item.read} ? '' : ' badge-active'"
                                  th:text="${item.read} ? 'Đã đọc' : 'Chưa đọc'">
                            </span>
                        </td>
                        <td>
                            <strong th:text="${item.title}">Thông báo</strong>
                            <div class="secondary-cell" th:text="${item.content}">Nội dung</div>
                        </td>
                        <td th:text="${item.createdAtFormatted}">—</td>
                        <td class="notification-actions">
                            <button class="button button-secondary mark-read"
                                    type="button"
                                    th:if="${!item.read}">
                                Đánh dấu đã đọc
                            </button>

                            <a class="button button-ghost"
                               th:if="${item.targetUrl != null and !#strings.isEmpty(item.targetUrl)}"
                               th:href="${item.targetUrl}">
                                Mở
                            </a>

                            <button class="button button-delete delete-notification"
                                    type="button"
                                    aria-label="Xóa thông báo">
                                Xóa
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(notifications) and #lists.isEmpty(lowStockAlerts)}">
                        <td class="notification-empty" colspan="4">
                            Không tìm thấy thông báo phù hợp.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
    (() => {
        const unreadBadge = document.querySelector('.notification-unread-badge');

        const updateUnread = count => {
            if (!unreadBadge) return;
            unreadBadge.textContent = count > 99 ? '99+' : String(count);
            unreadBadge.hidden = count <= 0;
        };

        document.querySelectorAll('.mark-read').forEach(button => {
            button.addEventListener('click', async () => {
                const row = button.closest('[data-notification-id]');
                const response = await fetch(
                    `/api/notifications/${row.dataset.notificationId}/read`,
                    { method: 'POST', credentials: 'same-origin' }
                );

                if (!response.ok) return;

                const data = await response.json();
                if (!data.success) return;

                button.remove();

                const badge = row.querySelector('.badge');
                badge.textContent = 'Đã đọc';
                badge.classList.remove('badge-active');

                updateUnread(data.unreadCount ?? 0);

                if (new URLSearchParams(window.location.search).get('status') === 'unread') {
                    row.remove();
                    if (!document.querySelector('[data-notification-id]')) {
                        window.location.reload();
                    }
                }
            });
        });

        document.getElementById('readAll')?.addEventListener('click', async () => {
            const response = await fetch('/api/notifications/read-all', {
                method: 'POST',
                credentials: 'same-origin'
            });

            if (!response.ok) return;

            const data = await response.json();
            if (!data.success) return;

            updateUnread(0);
            window.location.reload();
        });

        document.querySelectorAll('.delete-notification').forEach(button => {
            button.addEventListener('click', async () => {
                const row = button.closest('[data-notification-id]');
                const response = await fetch(
                    `/api/notifications/${row.dataset.notificationId}`,
                    { method: 'DELETE', credentials: 'same-origin' }
                );

                if (!response.ok) return;

                const data = await response.json();
                if (!data.success) return;

                updateUnread(data.unreadCount ?? 0);
                row.remove();

                if (!document.querySelector('[data-notification-id]')) {
                    window.location.reload();
                }
            });
        });
    })();
</script>
</body>
</html>
