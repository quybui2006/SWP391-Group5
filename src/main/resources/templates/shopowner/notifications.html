<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thông báo | FreshFruit</title><link rel="stylesheet" th:href="@{/css/shopowner.css}"><link rel="stylesheet" th:href="@{/css/shop-product.css}"></head>
<body><div class="app-shell"><aside th:replace="~{shopowner/fragments :: sidebar('notifications')}"></aside>
<main class="main-content product-management"><header class="topbar"><div><p class="breadcrumb">Shop Owner / <span>Thông báo</span></p><h1>Thông báo</h1><p class="muted" id="unreadCountLabel" th:text="${unreadCount + ' thông báo chưa đọc'}">0 thông báo chưa đọc</p></div><button type="button" class="button button-ghost" id="readAll" th:disabled="${unreadCount == 0}">Đánh dấu tất cả đã đọc</button></header>
<section class="panel">
<form method="get" th:action="@{/shopowner/notifications}" style="display:flex;gap:10px;align-items:center;padding:16px;flex-wrap:wrap;">
<input type="search" name="keyword" th:value="${keyword}" aria-label="Tìm thông báo" style="min-width:240px;flex:1;padding:10px 12px;border:1px solid #d7e0da;border-radius:6px;">
<select name="status" aria-label="Lọc trạng thái" style="padding:10px 12px;border:1px solid #d7e0da;border-radius:6px;">
<option value="all" th:selected="${selectedStatus == 'all'}">Tất cả</option>
<option value="unread" th:selected="${selectedStatus == 'unread'}">Chưa đọc</option>
<option value="read" th:selected="${selectedStatus == 'read'}">Đã đọc</option>
</select>
<button type="submit" class="button button-secondary">Tìm</button>
<a class="button button-ghost" th:href="@{/shopowner/notifications}">Xóa tìm kiếm</a>
</form>
<div class="table-wrap"><table><thead><tr><th>TRẠNG THÁI</th><th>THÔNG BÁO</th><th>THỜI GIAN</th><th>THAO TÁC</th></tr></thead><tbody>
<tr th:each="item : ${notifications}" th:attr="data-notification-id=${item.id},data-target-url=${item.targetUrl}">
<td><span class="badge" th:classappend="${item.read} ? '' : ' badge-active'" th:text="${item.read} ? 'Đã đọc' : 'Mới'"></span></td>
<td><strong th:text="${item.title}">Thông báo</strong><div class="secondary-cell" th:text="${item.content}">Nội dung</div></td>
<td th:text="${item.createdAtFormatted}">—</td><td><button class="button button-secondary mark-read" type="button" th:if="${!item.read}">Đã đọc</button><a class="button button-ghost" th:href="${item.targetUrl}">Mở</a><button class="button button-ghost delete-notification" type="button" aria-label="Xóa thông báo" title="Xóa thông báo">Xóa</button></td>
</tr><tr th:if="${#lists.isEmpty(notifications)}"><td colspan="4" th:text="${keyword != '' ? 'Không tìm thấy thông báo khớp.' : (selectedStatus == 'unread' ? 'Không còn thông báo chưa đọc.' : (selectedStatus == 'read' ? 'Chưa có thông báo đã đọc.' : 'Chưa có thông báo.'))}">Chưa có thông báo.</td></tr>
</tbody></table></div></section>
</main></div>
<script>
(() => {
    document.querySelectorAll('.mark-read').forEach(button => button.addEventListener('click', async () => {
        const row = button.closest('[data-notification-id]');
        const response = await fetch(`/api/notifications/${row.dataset.notificationId}/read`, {method: 'POST', credentials: 'same-origin'});
        if (!response.ok) return;
        const data = await response.json();
        if (!data.success) return;
        button.remove();
        row.querySelector('.badge').textContent = 'Đã đọc';
        updateUnreadCount(data.unreadCount);
        if (new URLSearchParams(window.location.search).get('status') === 'unread') {
            row.remove();
            if (!document.querySelector('[data-notification-id]')) window.location.reload();
        }
    }));
    document.querySelectorAll('.delete-notification').forEach(button => button.addEventListener('click', async () => {
        const row = button.closest('[data-notification-id]');
        const response = await fetch(`/api/notifications/${row.dataset.notificationId}`, {
            method: 'DELETE', credentials: 'same-origin'
        });
        if (!response.ok) return;
        const data = await response.json();
        if (!data.success) return;
        row.remove();
        updateUnreadCount(data.unreadCount);
        if (!document.querySelector('[data-notification-id]')) window.location.reload();
    }));
    document.getElementById('readAll')?.addEventListener('click', async () => {
        const response = await fetch('/api/notifications/read-all', {method: 'POST', credentials: 'same-origin'});
        if (!response.ok) return;
        const data = await response.json();
        if (!data.success) return;
        updateUnreadCount(data.unreadCount);
        document.querySelectorAll('.mark-read').forEach(button => button.remove());
        document.querySelectorAll('[data-notification-id] .badge').forEach(badge => {
            badge.textContent = 'Đã đọc';
            badge.classList.remove('badge-active');
        });
        // Refresh the filtered results so read items disappear from the unread view.
        if (new URLSearchParams(window.location.search).get('status') === 'unread') window.location.reload();
    });
    function updateUnreadCount(count) {
        const value = Number(count) || 0;
        const label = document.getElementById('unreadCountLabel');
        const readAll = document.getElementById('readAll');
        if (label) label.textContent = `${value} thông báo chưa đọc`;
        if (readAll) readAll.disabled = value === 0;
        const badge = document.querySelector('.notification-unread-badge');
        if (badge && value === 0) badge.remove();
        else if (badge) badge.textContent = value > 99 ? '99+' : String(value);
    }
})();
</script>
</body></html>
