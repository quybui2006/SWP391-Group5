<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="sidebar" th:fragment="sidebar(activePage)">

    <!-- Brand -->
    <a class="brand" th:href="@{/shopowner/home}">
        <span class="brand-mark">F</span>
        <span>
            Fresh<span>Fruit</span>
            <small>CHỦ CỬA HÀNG</small>
        </span>
    </a>

    <!-- Shop information -->
    <div class="shop-switcher">
        <div class="shop-avatar">SO</div>
        <div>
            <strong th:text="${shopName ?: 'Cửa hàng của tôi'}">
                Cửa hàng của tôi
            </strong>
            <small th:text="${shop != null && shop.approvalStatus == 'NOT_REGISTERED' ? 'Chưa mở shop' : 'Cửa hàng của tôi'}">Cửa hàng của tôi</small>
        </div>
    </div>

    <!-- Nút Đăng ký mở Shop nổi bật trong Sidebar nếu chưa có cửa hàng -->
    <div th:if="${shop != null && shop.approvalStatus == 'NOT_REGISTERED'}" style="margin: 0 5px 20px;">
        <a th:href="@{/seller/activate}" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px; background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: #fff; font-weight: 700; font-size: 12px; border-radius: 9px; text-decoration: none; box-shadow: 0 2px 6px rgba(22, 163, 74, 0.25);">
            <span>🏪</span> Đăng ký mở Shop
        </a>
    </div>

    <!-- Navigation -->
    <nav class="side-nav" aria-label="Điều hướng chủ cửa hàng">

        <span class="nav-label">TỔNG QUAN</span>

        <a th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
           th:href="@{/shopowner/home}">
            <span>⌂</span> Tổng quan
        </a>

        <span class="nav-label">QUẢN LÝ CỬA HÀNG</span>

        <a th:classappend="${activePage == 'products'} ? ' active' : ''"
           th:href="@{/shop/products}">
            <span>▦</span> Sản phẩm
        </a>

        <a th:classappend="${activePage == 'variants'} ? ' active' : ''"
           th:href="@{/shopowner/product-variants}">
            <span>▤</span> Biến thể sản phẩm
        </a>

        <a th:classappend="${activePage == 'promotions'} ? ' active' : ''"
           th:href="@{/shop/promotions}">
            <span>％</span> Khuyến mãi
        </a>

        <a th:classappend="${activePage == 'vouchers'} ? ' active' : ''"
           th:href="@{/shop/vouchers}"
           aria-label="Quản lý Voucher">
            <span aria-hidden="true">▣</span> Voucher
        </a>

<!--        <a th:classappend="${activePage == 'reopen-request'} ? ' active' : ''"-->
<!--           th:href="@{/shopowner/reopen-request}">-->
<!--            <span aria-hidden="true">↻</span> Yêu cầu mở lại Shop-->
<!--        </a>-->

<!--        <a th:classappend="${activePage == 'notifications'} ? ' active' : ''"-->
<!--           th:href="@{/shopowner/notifications}">-->
<!--            <span aria-hidden="true">♧</span> Thông báo-->
<!--        </a>-->

        <a th:classappend="${activePage == 'orders'} ? ' active' : ''"
           th:href="@{/shopowner/orders}">
            <span>◌</span> Đơn hàng
        </a>

        <a th:classappend="${activePage == 'inventory'} ? ' active' : ''"
           th:href="@{/shop/inventory}">
            <span>♧</span> Tồn kho
        </a>

        <span class="nav-label">KHÁC</span>

        <a href="#" data-pending>
            <span>⚙</span> Cài đặt
        </a>

        <a href="#" data-pending>
            <span>?</span> Trợ giúp
        </a>

        <form th:action="@{/logout}" method="post" style="margin: 8px 4px 0;">
            <button type="submit" style="width: 100%; display: flex; align-items: center; gap: 8px; color: #dc3545; background: #fff5f5; border: 1px solid rgba(220, 53, 69, 0.25); border-radius: 7px; padding: 7px 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
                <span>🚪</span> Đăng xuất
            </button>
        </form>

    </nav>

    <!-- Current user -->
    <div class="sidebar-footer">
        <div class="mini-user">
            <div class="avatar">SO</div>

            <div>
                <strong th:text="${ownerName ?: 'Chủ cửa hàng'}">
                    Chủ cửa hàng
                </strong>
                <small>Chủ cửa hàng</small>
            </div>

            <span>⋮</span>
        </div>
    </div>

    <!-- Sidebar interactions -->
    <script th:src="@{/js/shopowner.js}" defer></script>

</aside>

</body>
</html>
