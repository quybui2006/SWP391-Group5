<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <radialGradient id="kiwiFlesh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="28%" stop-color="#bbf7d0"/>
      <stop offset="65%" stop-color="#4ade80"/>
      <stop offset="92%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <linearGradient id="kiwiSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="greenLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="kiwiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#14532d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#kiwiShadow)">
    <!-- Decorative Leaf -->
    <path d="M52 14 C62 8 72 11 74 16 C74 23 66 28 57 24 Z" fill="url(#greenLeaf)"/>
    <path d="M55 17 Q65 16 71 14" stroke="#16a34a" stroke-width="0.8" fill="none"/>

    <!-- Kiwi Outer Fuzzy Skin Ring -->
    <circle cx="40" cy="45" r="28" fill="url(#kiwiSkin)"/>

    <!-- Kiwi Vibrant Flesh -->
    <circle cx="40" cy="45" r="25.5" fill="url(#kiwiFlesh)"/>

    <!-- Subtle radial rays in pulp -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.35" stroke-linecap="round">
      <line x1="40" y1="36" x2="40" y2="25"/>
      <line x1="40" y1="54" x2="40" y2="65"/>
      <line x1="31" y1="45" x2="20" y2="45"/>
      <line x1="49" y1="45" x2="60" y2="45"/>
      <line x1="34" y1="39" x2="26" y2="31"/>
      <line x1="46" y1="51" x2="54" y2="59"/>
      <line x1="34" y1="51" x2="26" y2="59"/>
      <line x1="46" y1="39" x2="54" y2="31"/>
    </g>

    <!-- Center Core Oval -->
    <ellipse cx="40" cy="45" rx="7.5" ry="9" fill="#fef9c3"/>

    <!-- Kiwi Tiny Black Seeds Ring -->
    <g fill="#1e293b">
      <ellipse cx="40" cy="33" rx="1" ry="1.6"/>
      <ellipse cx="40" cy="57" rx="1" ry="1.6"/>
      <ellipse cx="28" cy="45" rx="1.6" ry="1"/>
      <ellipse cx="52" cy="45" rx="1.6" ry="1"/>

      <ellipse cx="32" cy="36" rx="1.1" ry="1.5" transform="rotate(-35 32 36)"/>
      <ellipse cx="48" cy="54" rx="1.1" ry="1.5" transform="rotate(-35 48 54)"/>
      <ellipse cx="32" cy="54" rx="1.1" ry="1.5" transform="rotate(35 32 54)"/>
      <ellipse cx="48" cy="36" rx="1.1" ry="1.5" transform="rotate(35 48 36)"/>

      <ellipse cx="36" cy="34" rx="1" ry="1.5" transform="rotate(-15 36 34)"/>
      <ellipse cx="44" cy="34" rx="1" ry="1.5" transform="rotate(15 44 34)"/>
      <ellipse cx="36" cy="56" rx="1" ry="1.5" transform="rotate(15 36 56)"/>
      <ellipse cx="44" cy="56" rx="1" ry="1.5" transform="rotate(-15 44 56)"/>
    </g>

    <!-- Gloss Arc -->
    <path d="M22 36 A22 22 0 0 1 40 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.32"/>
  </g>
</svg>

