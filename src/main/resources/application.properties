spring.application.name=SWP391-Group5

spring.datasource.url=jdbc:mysql://localhost:3306/freshfruit_v5?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
# Schema do OnlineFruitShoppingPlatform.sql quan lý, không để Hibernate tự tạo bảng.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
