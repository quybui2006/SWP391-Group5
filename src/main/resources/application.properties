spring.application.name=SWP391-Group5

spring.datasource.url=jdbc:mysql://localhost:3306/freshfruit_v5?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ==============================================================================
# CẤU HÌNH GỬI EMAIL THẬT QUA GMAIL SMTP (THỰC TẾ)
# ==============================================================================
# BƯỚC 1: Điền địa chỉ Gmail gửi thư vào dòng spring.mail.username
# BƯỚC 2: Điền Mật khẩu ứng dụng (App Password 16 ký tự) vào dòng spring.mail.password
# (Không dùng mật khẩu đăng nhập tài khoản thông thường)
# ------------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Cấu hình bảo mật và Timeout cho kết nối Gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


