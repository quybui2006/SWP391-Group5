spring.application.name=SWP391-Group5

spring.datasource.url=jdbc:mysql://localhost:3306/FreshFruit?user=root
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

# Upload guard: aligns Spring multipart parsing with product image validation (5 MB).
# max-request-size allows multipart fields and boundaries in addition to the file.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
