spring.application.name=SWP391-Group5

# --- Database ---
# Mật khẩu lấy từ biến môi trường DB_PASSWORD, không ghi thẳng vào file.
# Vì mỗi máy đặt mật khẩu MySQL khác nhau, ghi cứng sẽ gây conflict
# mỗi lần merge với nhánh develop.
#
# Cách dùng trên máy (PowerShell):
#     $env:DB_PASSWORD="123456"
#
# Đặt vĩnh viễn cho tài khoản Windows hiện tại:
#     [Environment]::SetEnvironmentVariable("DB_PASSWORD","123456","User")
#     (mở lại PowerShell sau khi đặt)
spring.datasource.url=jdbc:mysql://localhost:3306/FreshFruit?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
# Schema do OnlineFruitShoppingPlatform.sql quan lý, không để Hibernate tự tạo bảng.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
